<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14213a">
  <title>HYPHA · hors ligne</title>
  <style>
    :root { color-scheme: dark light; }
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; background: #0f0f0e; color: #f0efec;
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 420px; padding: 24px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { margin: 0 0 8px; color: #c3c2b7; }
    .en { color: #898781; font-size: 14px; }
    button { margin-top: 16px; padding: 10px 20px; border: 0; border-radius: 8px; background: #3987e5; color: #fff;
             font: inherit; cursor: pointer; }
    @media (prefers-color-scheme: light) { body { background: #f3f3f1; color: #0b0b0b; } p { color: #52514e; } }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/icon-192.png" alt="">
    <h1>HYPHA est hors ligne</h1>
    <p>Pas de réseau pour joindre le serveur. Les alertes reprendront dès le retour de la connexion.</p>
    <p class="en">HYPHA is offline: no network to reach the server.</p>
    <button type="button" id="retry">Réessayer · Retry</button>
  </main>
  <script>
    (function () {
      var go = function () { location.reload(); };
      document.getElementById('retry').addEventListener('click', go);
      window.addEventListener('online', go);
    })();
  </script>
</body>
</html>
