# HYPHA auto-hébergé : interface statique (ui/), fichiers d'installation de l'agent (/install/),
# et routage de /api/* et /v1/* (OTLP) vers hypha-api. HTTPS seulement : aucun port en clair.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:hypha:10m;

    # Corps d'ingestion : 10 Mo décompressés au plus côté API ; compressés ils sont bien plus petits.
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8231;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location /v1/ {
        proxy_pass http://api:8231;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    # Script RUM : chargé par les pages des sites suivis, donc lisible depuis n'importe quelle origine.
    location /rum/ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Application installable : manifeste au type attendu par les navigateurs.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /install/ {
        alias /srv/hypha-install/;
        autoindex off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
